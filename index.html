<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title><style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        min-height: 100vh;
    }

    header {
        padding: 20px;
        text-align: center;
        background: rgba(0, 0, 0, 0.2);
    }

    nav {
        display: flex;
        justify-content: center;
        gap: 25px;
        padding: 15px;
    }

    nav a {
        color: white;
        text-decoration: none;
        font-weight: bold;
    }

    .container {
        text-align: center;
        padding: 100px 20px;
    }

    h1 {
        font-size: 42px;
        margin-bottom: 20px;
    }

    p {
        font-size: 18px;
        margin-bottom: 30px;
    }

    button {
        background: white;
        color: #764ba2;
        border: none;
        padding: 12px 25px;
        border-radius: 25px;
        cursor: pointer;
        font-size: 16px;
    }

    button:hover {
        background: #eeeeee;
    }

    footer {
        text-align: center;
        padding: 20px;
    }
</style>

</head><body><header>
    <h2>My Website</h2>
</header>

<nav>
    <a href="#home">Home</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
</nav>

<section class="container" id="home">
    <h1>Welcome to My Website!</h1>
    <p>Explore my first frontend project built using HTML, CSS and JavaScript.</p>
    <button onclick="showMessage()">Get Started</button>
</section>

<footer>
    <p>© 2026 My Website | Created with ❤️</p>
</footer>

<script>
    function showMessage() {
        alert("Welcome! Thanks for visiting my website.");
    }
</script>
</body>
</html>
